  <header class="site-header">
    <nav class="navbar container" aria-label="Navegación principal">
      <a class="brand" href="#hero" aria-label="Padel Arena — Inicio">
        <svg class="brand__mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <rect x="3" y="4" width="18" height="16" rx="1.5"></rect>
          <line x1="12" y1="4" x2="12" y2="20"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <line x1="3" y1="14" x2="21" y2="14"></line>
        </svg>
        <span class="brand__name">Padel<span class="brand__accent">Arena</span></span>
      </a>

      <button class="nav-toggle" type="button" aria-controls="nav-menu" aria-expanded="false" aria-label="Abrir menú">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <div class="nav-menu" id="nav-menu">
        <ul class="nav-links">
          <li><a href="#hero">Inicio</a></li>
          <li><a href="#courts">Pistas</a></li>
          <li><a href="#services">Servicios</a></li>
          <li><a href="#contact">Contacto</a></li>
        </ul>

        <div class="nav-auth">
          {% if user.is_authenticated %}
            <a class="nav-auth__link" href="#">Mis reservas</a>
            <span class="nav-auth__user">{{ user.get_full_name|default:user.username }}</span>
            <a class="btn btn--ghost btn--sm" href="{% url 'logout' %}">Cerrar sesión</a>
          {% else %}
            <a class="nav-auth__link" href="{% url 'login' %}">Iniciar sesión</a>
            <a class="btn btn--primary btn--sm" href="{% url 'registro' %}">Registrarse</a>
          {% endif %}
        </div>
      </div>
    </nav>
  </header>
